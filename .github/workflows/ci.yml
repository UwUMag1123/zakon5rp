name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Сгенерированные файлы совпадают с docs.json
        run: python build.py --check

      - name: Логика поиска, подсветки и статусов
        run: node tests/logic.test.mjs

      - name: Внутренние ссылки
        run: node tests/links.test.mjs

      - name: Отрисовка страницы (DOM-заглушка)
        run: node tests/render.test.mjs

      - name: Текст страниц совпадает с docs.json
        run: python tests/pages.py
